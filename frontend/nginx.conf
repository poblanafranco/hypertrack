server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Docker resuelve "backend" en tiempo de petición: nginx arranca aunque el backend tarde en levantar
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        return 503 '{"error":"El servidor no está disponible en este momento. Intenta de nuevo en unos segundos.","code":"BACKEND_DOWN"}';
    }

    # Archivos con hash en el nombre: cache largo. index.html: nunca cacheado (evita builds viejos).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
