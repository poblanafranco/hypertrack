name: hypertrack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hypertrack
      POSTGRES_PASSWORD: hypertrack
      POSTGRES_DB: hypertrack
    # Puerto 5433 en tu PC (y solo local) para NO chocar con un PostgreSQL de Windows que use el 5432.
    # Dentro de Docker, el backend siempre lo alcanza como db:5432.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypertrack -d hypertrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://hypertrack:hypertrack@db:5432/hypertrack?schema=public"
      JWT_SECRET: "cambia-esto-por-un-secreto-largo-y-aleatorio"
      PORT: 4000
      CORS_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health/db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db_data:
